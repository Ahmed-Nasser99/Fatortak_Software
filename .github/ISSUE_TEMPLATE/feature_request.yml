name: Feature request
description: Suggest an improvement or a new capability.
title: "[feature] "
labels: ["enhancement", "needs triage"]
body:
  - type: markdown
    attributes:
      value: |
        Strong feature requests describe the **business problem** first. "We need recurring invoices because our retainer clients are billed monthly" is more useful than "add a repeat button".

  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe your business, country and workflow.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How do you imagine it working?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you have tried
      description: Other tools, spreadsheets or workarounds.
    validations:
      required: false

  - type: dropdown
    id: audience
    attributes:
      label: Who benefits?
      multiple: true
      options:
        - Small business owner
        - Accountant / bookkeeper
        - Project-based company
        - Retail / inventory-heavy business
        - HR / payroll team
        - Developer / integrator
        - Self-hoster
    validations:
      required: true

  - type: dropdown
    id: contribute
    attributes:
      label: Can you help build it?
      options:
        - "Yes, I can open a pull request"
        - "Yes, I can help test or translate"
        - "I can sponsor or pay for it"
        - "No, I can only describe the need"
    validations:
      required: true

  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues and discussions.
          required: true
        - label: This request is about Fatortak, not a support question.
          required: true
