name: Marketing daily

on:
  schedule:
    # 09:00 UTC / 11:00 Cairo. Adjust if your audience is in another timezone.
    - cron: "0 9 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Preview only. Set to false to publish when MARKETING_LIVE=true."
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: marketing-daily
  cancel-in-progress: false

jobs:
  post:
    name: Post due content
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: marketing/automation
    env:
      MARKETING_LIVE: ${{ secrets.MARKETING_LIVE }}
      X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
      LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
      LINKEDIN_AUTHOR_URN: ${{ secrets.LINKEDIN_AUTHOR_URN }}
      LINKEDIN_VERSION: ${{ secrets.LINKEDIN_VERSION }}
      BLUESKY_HANDLE: ${{ secrets.BLUESKY_HANDLE }}
      BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
      BLUESKY_SERVICE: ${{ secrets.BLUESKY_SERVICE }}
      MASTODON_INSTANCE: ${{ secrets.MASTODON_INSTANCE }}
      MASTODON_ACCESS_TOKEN: ${{ secrets.MASTODON_ACCESS_TOKEN }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      PLAUSIBLE_API_KEY: ${{ secrets.PLAUSIBLE_API_KEY }}
      PLAUSIBLE_SITE_ID: ${{ secrets.PLAUSIBLE_SITE_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "20"

      - name: Restore posting state
        uses: actions/cache/restore@v4
        with:
          path: marketing/automation/.state
          key: marketing-state-${{ github.run_id }}
          restore-keys: |
            marketing-state-

      - name: Ensure state directory
        run: mkdir -p .state

      - name: Validate queue
        run: node src/cli.mjs validate

      - name: Preview or publish
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.dry_run }}" = "true" ]; then
            echo "::notice::Manual dry run requested."
            node src/cli.mjs post --dry-run
          elif [ "${MARKETING_LIVE}" = "true" ]; then
            echo "::notice::Live posting is enabled."
            node src/cli.mjs post --live
          else
            echo "::warning::MARKETING_LIVE is not true. Running a dry run instead. Add the secret when you are ready to publish."
            node src/cli.mjs post --dry-run
          fi

      - name: Save posting state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: marketing/automation/.state
          key: marketing-state-${{ github.run_id }}
