name: Repository metadata

on:
  workflow_dispatch:
    inputs:
      apply:
        description: "Apply changes. Leave false to preview."
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: repo-metadata
  cancel-in-progress: false

jobs:
  metadata:
    name: Sync description, homepage and topics
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: marketing/automation
    env:
      REPO_ADMIN_TOKEN: ${{ secrets.REPO_ADMIN_TOKEN }}
      GITHUB_REPOSITORY: ${{ github.repository }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Preview
        if: ${{ inputs.apply == false }}
        run: node src/cli.mjs repo --dry-run

      - name: Apply
        if: ${{ inputs.apply == true }}
        run: node src/cli.mjs repo
