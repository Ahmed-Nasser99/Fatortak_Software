name: fatortak

services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
      MSSQL_PID: Express
    ports:
      - "${DB_PORT:-1433}:1433"
    volumes:
      - mssql_data:/var/opt/mssql
      - mssql_backup:/var/opt/mssql/backup
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q 'SELECT 1'",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  api:
    build:
      context: ./fatortak_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      Deployment__Mode: ${DEPLOYMENT_MODE:-SelfHosted}
      SelfHosted__AllowRegistration: ${SELF_HOSTED_ALLOW_REGISTRATION:-true}
      ConnectionStrings__DefaultConnection: "Server=db;Database=Fatortak;User Id=sa;Password=${MSSQL_SA_PASSWORD};Encrypt=False;TrustServerCertificate=True;"
      Jwt__Key: ${JWT_KEY}
      Jwt__Issuer: https://fatortak.net
      Jwt__Audience: https://fatortak.net
      SeedAdmin__Email: ${SEED_ADMIN_EMAIL}
      SeedAdmin__UserName: ${SEED_ADMIN_USERNAME}
      SeedAdmin__Password: ${SEED_ADMIN_PASSWORD}
      GeminiApiKey: ${GEMINI_API_KEY}
      OpenRouterApiKey: ${OPENROUTER_API_KEY}
      EmailSetting__Host: ${SMTP_HOST}
      EmailSetting__Port: ${SMTP_PORT:-587}
      EmailSetting__Email: ${SMTP_EMAIL}
      EmailSetting__Password: ${SMTP_PASSWORD}
      EmailSetting__DisplayName: Fatortak
      App__FrontendBaseUrl: ${PUBLIC_WEB_URL:-http://localhost:3000}
      Cors__AllowedOrigins__0: ${PUBLIC_WEB_URL:-http://localhost:3000}
    ports:
      - "${API_PORT:-5000}:8080"
    volumes:
      - uploads:/app/wwwroot/uploads
      - dataprotection:/app/App_Data

  web:
    build:
      context: ./fatortak_frontend
      args:
        VITE_API_URL: ${PUBLIC_API_URL}
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${WEB_PORT:-3000}:80"

volumes:
  mssql_data:
  mssql_backup:
  uploads:
  dataprotection:
