<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-label="Fatortak ledger architecture: invoices, purchases, expenses, payments and payroll post to one double-entry journal, which produces the trial balance, P&L, balance sheet and project margin.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070d1b"/>
      <stop offset="0.6" stop-color="#0b1a33"/>
      <stop offset="1" stop-color="#07121f"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="0.5" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#34d399"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#38bdf8"/>
    </marker>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="45"/>
    </filter>
  </defs>

  <rect width="1200" height="420" rx="20" fill="url(#bg)"/>
  <circle cx="1080" cy="40" r="180" fill="#38bdf8" opacity="0.12" filter="url(#glow)"/>
  <circle cx="90" cy="400" r="160" fill="#6366f1" opacity="0.14" filter="url(#glow)"/>
  <rect x="0.5" y="0.5" width="1199" height="419" rx="19.5" fill="none" stroke="#1e3a5f"/>

  <text x="52" y="54" font-family="Segoe UI, Tahoma, Arial, sans-serif" font-size="15" font-weight="700" letter-spacing="3" fill="#7dd3fc">ONE LEDGER</text>
  <text x="52" y="86" font-family="Segoe UI, Tahoma, Arial, sans-serif" font-size="24" font-weight="700" fill="#f8fafc">Every module writes to the same books</text>

  <g font-family="Segoe UI, Tahoma, Arial, sans-serif">
    <g>
      <rect x="52" y="124" width="230" height="40" rx="9" fill="#0f2038" stroke="#1e3a5f"/>
      <circle cx="74" cy="144" r="5" fill="#38bdf8"/>
      <text x="90" y="150" font-size="14" fill="#dbeafe">Sales invoices</text>

      <rect x="52" y="174" width="230" height="40" rx="9" fill="#0f2038" stroke="#1e3a5f"/>
      <circle cx="74" cy="194" r="5" fill="#818cf8"/>
      <text x="90" y="200" font-size="14" fill="#dbeafe">Purchase bills</text>

      <rect x="52" y="224" width="230" height="40" rx="9" fill="#0f2038" stroke="#1e3a5f"/>
      <circle cx="74" cy="244" r="5" fill="#f59e0b"/>
      <text x="90" y="250" font-size="14" fill="#dbeafe">Expenses</text>

      <rect x="52" y="274" width="230" height="40" rx="9" fill="#0f2038" stroke="#1e3a5f"/>
      <circle cx="74" cy="294" r="5" fill="#34d399"/>
      <text x="90" y="300" font-size="14" fill="#dbeafe">Payments &amp; cheques</text>

      <rect x="52" y="324" width="230" height="40" rx="9" fill="#0f2038" stroke="#1e3a5f"/>
      <circle cx="74" cy="344" r="5" fill="#a78bfa"/>
      <text x="90" y="350" font-size="14" fill="#dbeafe">Payroll</text>
    </g>

    <path d="M300 244 H376" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)" opacity="0.7"/>

    <g>
      <rect x="392" y="178" width="300" height="132" rx="16" fill="#0f2038" stroke="#38bdf8" stroke-opacity="0.55"/>
      <text x="422" y="216" font-size="13" font-weight="700" letter-spacing="2" fill="#7dd3fc">CORE</text>
      <text x="422" y="246" font-size="22" font-weight="700" fill="#f8fafc">Double-entry journal</text>
      <text x="422" y="274" font-size="13" fill="#94a3b8">Balanced postings, one source of truth.</text>
      <text x="422" y="294" font-size="13" fill="#94a3b8">Arabic and English. Full RTL.</text>
    </g>

    <path d="M708 244 H784" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)" opacity="0.7"/>

    <g>
      <rect x="800" y="124" width="348" height="40" rx="9" fill="#0f2038" stroke="#1e3a5f"/>
      <text x="824" y="150" font-size="14" fill="#e2e8f0">Trial balance</text>
      <rect x="800" y="174" width="348" height="40" rx="9" fill="#0f2038" stroke="#1e3a5f"/>
      <text x="824" y="200" font-size="14" fill="#e2e8f0">Profit &amp; loss</text>
      <rect x="800" y="224" width="348" height="40" rx="9" fill="#0f2038" stroke="#1e3a5f"/>
      <text x="824" y="250" font-size="14" fill="#e2e8f0">Balance sheet</text>
      <rect x="800" y="274" width="348" height="40" rx="9" fill="#0f2038" stroke="#1e3a5f"/>
      <text x="824" y="300" font-size="14" fill="#e2e8f0">Cash flow</text>
      <rect x="800" y="324" width="348" height="40" rx="9" fill="#0f2038" stroke="#34d399" stroke-opacity="0.45"/>
      <text x="824" y="350" font-size="14" fill="#6ee7b7">Project margin</text>
    </g>
  </g>

  <text x="52" y="398" font-family="Segoe UI, Tahoma, Arial, sans-serif" font-size="13" fill="#64748b">Illustrative architecture. Project costs that are not linked are reported as unallocated, not hidden.</text>
</svg>
